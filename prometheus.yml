global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'fastapi_app'
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics

  - job_name: 'flask_app'
    static_configs:
      - targets: ['web:5000']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: 'health_checks'
    static_configs:
      - targets: ['api:8000', 'web:5000']
    metrics_path: /health
    scrape_interval: 30s

  - job_name: 'redis_exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 10s