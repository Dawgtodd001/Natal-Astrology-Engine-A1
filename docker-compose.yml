version: '3.8'

services:
  # Web interface (Flask)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - API_BASE_URL=/api
      - DEFAULT_API_KEY=${DEFAULT_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_TTL=604800
    depends_on:
      - api
      - redis
    restart: unless-stopped
    networks:
      - astrology-network

  # API service (FastAPI)
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DEFAULT_API_KEY=${DEFAULT_API_KEY}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_TTL=604800
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - astrology-network

  # Redis cache
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ""
    restart: unless-stopped
    networks:
      - astrology-network

volumes:
  redis-data:

networks:
  astrology-network:
    driver: bridge